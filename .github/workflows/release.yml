name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
      APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
      APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
      APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apex-release.jks"
          echo "APEX_KEYSTORE_FILE=$RUNNER_TEMP/apex-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name and verify artifact
        id: artifact
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
          if [ -z "${version:-}" ]; then version="1.0.0"; fi
          target="APEX-Calculator-v${version}-release.apk"
          cp "$apk" "$target"
          size=$(stat -c%s "$target")
          echo "Built $target ($size bytes)"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/aapt2" dump badging "$target" | head -3
          "$build_tools/apksigner" verify --print-certs "$target" | head -5
          if [ -z "${APEX_KEYSTORE_FILE:-}" ]; then
            echo "::warning::No signing secrets configured; the APK uses the debug signing identity."
          fi
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "name=$target" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.artifact.outputs.path }}" \
            --title "APEX Calculator ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME} of APEX Calculator. Fully offline. See docs/ACCEPTANCE_CHECKLIST.md for verification status."
