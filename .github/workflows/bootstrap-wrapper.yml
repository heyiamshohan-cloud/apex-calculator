name: Bootstrap Gradle Wrapper

# One-time helper: this repository was created without a local JDK/Gradle, so the
# binary Gradle wrapper JAR is generated on a runner and committed back.
on:
  push:
    paths:
      - 'gradle/wrapper/gradle-wrapper.jar'
      - '.github/workflows/bootstrap-wrapper.yml'
      - '.github/actions/publish-log/action.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    name: Generate and commit Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap wrapper
        id: bootstrap
        run: |
          set -uo pipefail
          LOG=/tmp/build.log
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          echo "== environment =="
          java -version || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper already present"
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "== downloading gradle 8.9 =="
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip || { echo "download failed"; exit 1; }
          ls -la /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          GRADLE_BIN=/tmp/gradle-dist/gradle-8.9/bin/gradle
          "$GRADLE_BIN" --version
          mkdir -p /tmp/wrappergen
          cd /tmp/wrappergen
          printf 'rootProject.name = "wrappergen"\n' > settings.gradle.kts
          "$GRADLE_BIN" wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
          echo "== generated =="
          find /tmp/wrappergen -maxdepth 3 -type f | sort
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cp -v /tmp/wrappergen/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          cp -v /tmp/wrappergen/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          cp -v /tmp/wrappergen/gradlew /tmp/wrappergen/gradlew.bat .
          chmod +x gradlew
          echo "== verifying wrapper (downloads distribution) =="
          ./gradlew --version
          echo "== committing =="
          git config user.name "apex-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f gradle gradlew gradlew.bat
          git commit -m "chore: add Gradle wrapper 8.9 (generated on CI) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish diagnostic log
        if: always()
        uses: ./.github/actions/publish-log
        with:
          source: /tmp/build.log
          name: bootstrap.log
