name: Bootstrap Gradle Wrapper

# One-time helper: this repository was created without a local JDK/Gradle, so the
# binary Gradle wrapper JAR is generated on a runner and committed back.
on:
  push:
    paths:
      - 'gradle/wrapper/gradle-wrapper.jar'
      - '.github/workflows/bootstrap-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    name: Generate and commit Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check whether the wrapper already exists
        id: check
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.present == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        if: steps.check.outputs.present == 'false'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate wrapper in a scratch directory
        if: steps.check.outputs.present == 'false'
        run: |
          set -euo pipefail
          mkdir -p /tmp/wrappergen
          cd /tmp/wrappergen
          gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
          ls -la
          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp -v gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/gradle/wrapper/"
          cp -v gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/gradle/wrapper/"
          cp -v gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          chmod +x "$GITHUB_WORKSPACE/gradlew"

      - name: Verify wrapper
        if: steps.check.outputs.present == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ./gradlew --version

      - name: Commit wrapper
        if: steps.check.outputs.present == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "apex-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f gradle gradlew gradlew.bat
          if git diff --cached --quiet; then
            echo "Wrapper already committed; nothing to do."
          else
            git commit -m "chore: add Gradle wrapper 8.9 (generated on CI) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Emit base64 fallback of wrapper jar
        if: steps.check.outputs.present == 'false'
        run: |
          base64 -w 0 gradle/wrapper/gradle-wrapper.jar | fold -w 500
